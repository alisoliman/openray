name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing SemVer tag; select this same tag as the workflow ref
        required: true
        type: string
      publish:
        description: Publish after verification; otherwise prepare a draft
        default: false
        type: boolean

permissions:
  contents: read

# Preserve queued version tags. Never cancel a run that may have submitted to Apple.
concurrency:
  group: openray-release
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      marketing_version: ${{ steps.release.outputs.marketing_version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve an existing tag on the default branch
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BUILD_NUMBER: ${{ github.run_number }}
          TRIGGER_REF: ${{ github.ref }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          python3 scripts/release.py metadata --tag "$RELEASE_TAG" --build-number "$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          if [[ "$TRIGGER_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo 'Run the workflow at the same version tag supplied in the tag input.' >&2
            exit 1
          fi
          source_sha=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          if [[ "$source_sha" != "$TRIGGER_SHA" ]]; then
            echo 'The tag no longer matches the triggering commit; refusing a changed source.' >&2
            exit 1
          fi
          git merge-base --is-ancestor "$source_sha" "origin/$DEFAULT_BRANCH"
          printf 'sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

  build:
    name: Sign and notarize Apple silicon release
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 90
    environment: release
    outputs:
      artifact_id: ${{ steps.packages.outputs.artifact-id }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Verify release tooling and app
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          ./scripts/check-workflows.sh
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/test-ci-signing.py
          ./scripts/verify.sh
      - name: Import temporary signing credentials
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          OPENRAY_SIGNING_IDENTITY: ${{ vars.OPENRAY_SIGNING_IDENTITY }}
        run: ./scripts/ci-signing.sh setup
      - name: Build, sign, notarize, and verify packages
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.marketing_version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ./scripts/package-release.sh --skip-tests --version "$RELEASE_VERSION" \
            --build-number "$BUILD_NUMBER" --output "$RUNNER_TEMP/openray-release"
      - name: Stage release assets with provenance metadata
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 scripts/release.py stage --package-dir "$RUNNER_TEMP/openray-release" \
            --output "$RUNNER_TEMP/openray-publish" --tag "$RELEASE_TAG" \
            --build-number "$BUILD_NUMBER" --sha "$RELEASE_SHA"
      - name: Attest the final notarized assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/openray-publish/OpenRay-macos-arm64.dmg
            ${{ runner.temp }}/openray-publish/OpenRay-macos-arm64.zip
            ${{ runner.temp }}/openray-publish/release.json
          create-storage-record: false
      - name: Save verified release assets
        id: packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenRay-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openray-publish/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Save release diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenRay-release-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/openray-release/*.log
            ${{ runner.temp }}/openray-release/*-notarization*.json
            ${{ runner.temp }}/openray-release/signature-details.txt
            ${{ runner.temp }}/openray-release/build-info.txt
            ${{ runner.temp }}/openray-release/OpenRay.xcarchive/dSYMs
            .build/verification/Logs/Test/*.xcresult
          include-hidden-files: true
          retention-days: 30
      - name: Remove temporary signing credentials
        if: always()
        run: ./scripts/ci-signing.sh cleanup

  publish:
    name: Prepare or publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/openray-publish
      - name: Verify draft assets and update latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          publish_args=()
          if [[ "$PUBLISH_RELEASE" == true ]]; then publish_args+=(--publish); fi
          python3 scripts/release.py publish --directory "$RUNNER_TEMP/openray-publish" \
            --repo "$GH_REPO" --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" "${publish_args[@]}"
          printf 'Release: https://github.com/%s/releases/tag/%s\n' "$GH_REPO" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
