name: OpenRay
options:
  bundleIdPrefix: com.alisoliman
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    ARCHS: arm64
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SDKROOT: macosx
    SUPPORTED_PLATFORMS: macosx
targets:
  OpenRay:
    type: application
    platform: macOS
    sources:
      - OpenRay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alisoliman.openray
        PRODUCT_NAME: OpenRay
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_LSUIElement: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
  OpenRayTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - OpenRayTests
    dependencies:
      - target: OpenRay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alisoliman.openray.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OpenRay:
    build:
      targets:
        OpenRay: all
        OpenRayTests: [test]
    test:
      environmentVariables:
        OPENRAY_TEST_AI: $(OPENRAY_TEST_AI)
      targets:
        - OpenRayTests
